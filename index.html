<!DOCTYPE html>
<html lang="en">

<head>

    <title>Modern Login UI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <div class="login-card">


        <h1>Welcome Back</h1>


        <p class="subtitle">

            Login to continue your account

        </p>



        <div class="input-box">

            <label>Email Address</label>

            <input 
            type="email"
            id="email"
            placeholder="Enter your email">

        </div>




        <div class="input-box">


            <label>Password</label>


            <input
            type="password"
            id="password"
            placeholder="Enter password">


        </div>



        <div class="options">


            <label>

                <input type="checkbox">

                Remember me

            </label>


            <span onclick="showPassword()">

                Show Password

            </span>


        </div>




        <button onclick="loginUser()">

            Login

        </button>




        <a href="#" class="forgot">

            Forgot Password?

        </a>



        <p class="signup">

            Don't have an account?

            <a href="#">
                Sign Up
            </a>


        </p>



    </div>



</div>




<script src="script.js"></script>


</body>

</html>
